<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Radar</title>
<meta name="description" content="Every Claude Code session on this machine, what it is doing, and when it needs you.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand" title="Connecting">
    <svg class="mark" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2" opacity=".5"/><circle class="mark-dot" id="live-dot" cx="16" cy="16" r="3"/></svg>
    <span class="brand-name">Radar</span>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="topbar-right">
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5h12M2 8h12M2 11.5h12"/><circle cx="10.5" cy="4.5" r="1.6" fill="var(--bg)"/><circle cx="5.5" cy="8" r="1.6" fill="var(--bg)"/><circle cx="9" cy="11.5" r="1.6" fill="var(--bg)"/></svg>
    </button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Projects"></nav>

<main class="canvas-wrap" id="canvas-wrap">
  <svg id="graph" class="graph" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
  <div class="canvas-tools">
    <button class="tool" id="zoom-out" title="Zoom out (-)">−</button>
    <button class="tool" id="zoom-in" title="Zoom in (+)">+</button>
    <button class="tool" id="fit-btn" title="Fit to view (f)">fit</button>
  </div>
  <div class="empty" id="empty" hidden></div>
</main>

<aside class="drawer" id="drawer" hidden aria-label="Session details">
  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-summary" id="drawer-summary"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
  <div class="stream-tools" id="stream-tools">
    <div class="seg" role="tablist">
      <button class="seg-btn on" data-mode="story" role="tab" title="Prompts, replies, and the work in between as one line per step">Story</button>
      <button class="seg-btn" data-mode="raw" role="tab" title="Every transcript entry (r)">Raw</button>
    </div>
    <button class="chip" id="thinking-toggle" title="Show Claude's thinking (t)">thinking</button>
    <button class="chip on right" id="follow" title="Follow the newest entries (Shift+F)">follow</button>
  </div>
  <div class="stream" id="stream"><button class="link" id="load-earlier" hidden>Load earlier</button><div id="stream-list"></div></div>
</aside>

<div class="popover" id="attention-pop" hidden></div>
<div class="popover settings" id="settings-pop" hidden>
  <div class="pop-head"><span>Settings</span><button class="icon-btn" id="settings-close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <label>Summaries
    <select id="summaries-mode">
      <option value="auto">automatic</option>
      <option value="manual">on request</option>
      <option value="off">off</option>
    </select>
  </label>
  <label>Refresh while working
    <select id="summaries-refresh">
      <option value="2">every 2 min</option>
      <option value="4">every 4 min</option>
      <option value="10">every 10 min</option>
      <option value="30">every 30 min</option>
    </select>
  </label>
  <p class="hint" id="spend">Written by Haiku through your own claude login.</p>
  <p class="hint" id="hooks-row"></p>
  <div class="keys"><span><kbd>n</kbd>next needs you</span><span><kbd>f</kbd>fit</span><span><kbd>e</kbd>ended</span><span><kbd>t</kbd>thinking</span><span><kbd>r</kbd>raw</span><span><kbd>1</kbd>–<kbd>9</kbd> project</span><span><kbd>0</kbd>Active</span><span><kbd>Esc</kbd>close</span></div>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
