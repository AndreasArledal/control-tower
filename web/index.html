<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Radar</title>
<meta name="description" content="Every Claude Code session on this machine, what it is doing, and when it needs you.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="live-dot" id="live-dot" title="Connecting"></span><span class="brand-name">Radar</span><span class="brand-sub" id="brand-sub">connecting…</span></div>
  <div class="topbar-right">
    <button class="badge" id="attention-badge" hidden aria-label="Sessions that need you"><span id="attention-count">0</span></button>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<nav class="rail" id="rail" aria-label="Projects">
  <button class="chip all selected" data-project="*">All</button>
</nav>

<main class="canvas-wrap" id="canvas-wrap">
  <svg id="graph" class="graph" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport"></g>
  </svg>
  <div class="canvas-tools">
    <label class="toggle"><input type="checkbox" id="show-exited"> ended</label>
    <button class="tool" id="zoom-out" title="Zoom out (-)">−</button>
    <button class="tool" id="zoom-in" title="Zoom in (+)">+</button>
    <button class="tool" id="fit-btn" title="Fit to view (f)">fit</button>
  </div>
  <div class="empty" id="empty" hidden></div>
</main>

<aside class="drawer" id="drawer" hidden aria-label="Session details">
  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-summary" id="drawer-summary"></div>
  <div class="drawer-stats" id="drawer-stats"></div>
  <div class="stream-tools">
    <button class="filter on" data-filter="thinking" title="Toggle thinking (t)">thinking</button>
    <button class="filter on" data-filter="tools" title="Toggle tools (u)">tools</button>
    <button class="filter on" data-filter="text" title="Toggle replies (r)">replies</button>
    <label class="toggle follow" title="Follow the newest entries (f)"><input type="checkbox" id="follow" checked> follow</label>
  </div>
  <div class="stream" id="stream"><button class="link" id="load-earlier" hidden>Load earlier</button><div id="stream-list"></div></div>
</aside>

<div class="popover" id="attention-pop" hidden></div>
<div class="popover settings" id="settings-pop" hidden>
  <label>Summaries
    <select id="summaries-mode">
      <option value="auto">automatic</option>
      <option value="manual">on request</option>
      <option value="off">off</option>
    </select>
  </label>
  <p class="hint">Written by Haiku through your own claude login, about a fifth of a cent each.</p>
  <div id="hooks-row"></div>
  <p class="hint">Keys: <kbd>n</kbd> next that needs you · <kbd>f</kbd> fit · <kbd>Esc</kbd> close · <kbd>t</kbd> <kbd>u</kbd> <kbd>r</kbd> filters</p>
</div>

<div class="toasts" id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
